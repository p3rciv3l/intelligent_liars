models:
  - name: qwen3-vl-8b-thinking-baseline
    model: Qwen/Qwen3-VL-8B-Thinking
    revision: 92f3c4b4feadd3a016ef468d103bb5f58b2a2c6b
    processor_revision: 92f3c4b4feadd3a016ef468d103bb5f58b2a2c6b
    endpoint:
      protocol: openai-chat-completions
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel@sha256:14611869895df612b7b07227d5925f30ec3cd6673bad58ce3d84ed107950e014
      python: "3.11"
      install_command: uv sync --frozen --no-dev --group endpoint --no-editable
      preflight_command: qwen-endpoint --dry-run
      command: qwen-endpoint --host 127.0.0.1 --port 8000
      provisioning_script: scripts/provision_qwen_endpoint.sh
      environment_names:
        - QWEN_ENDPOINT_API_KEY
        - HF_HOME
      secret_injection:
        source_environment: QWEN_ENDPOINT_API_KEY
        path: /run/qwen-endpoint/api-key
        mode: "0600"
      runtime:
        accelerate: "1.1.1"
        flash-attn: "2.7.4.post1"
        ninja: "1.11.1.3"
        packaging: "24.2"
        qwen-vl-utils: "0.0.14"
        setuptools: "75.8.0"
        torch: "2.5.1"
        transformers: "4.57.1"
        wheel: "0.45.1"
      routes:
        - /health
        - /v1/models
        - /v1/chat/completions
    inference:
      dtype: bfloat16
      attention_implementation: flash_attention_2
      quantization: null
      do_sample: false
      temperature: 0
      top_p: 0.9
      max_output_tokens: 32768
      serialization: single-inference-lock
      model_workers_per_gpu: 1
      horizontal_scaling: multiple identical workers behind the AWS controller
    client_policy:
      history_n: 4
      image_max: 4
    limits:
      max_request_bytes: 8388608
      max_image_bytes: 6291456
      max_image_pixels: 16000000
      max_images: 4
      max_text_chars: 200000

  # Prefer the official Z.AI endpoint; fall back only to Wafer.
  # OpenRouter currently lists these endpoints as fp8 and fp4 respectively;
  # do not add a full-precision quantization filter until fp16/bf16/fp32 exists.
  - name: glm-5.2
    model: z-ai/glm-5.2
    temperature: 0.1
    top_p: 0.95
    max_tokens: 2048
    provider:
      order:
        - z-ai/fp8
        - wafer/fp4
      only:
        - z-ai/fp8
        - wafer/fp4
      allow_fallbacks: true
      require_parameters: true
