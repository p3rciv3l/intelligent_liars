<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="430" viewBox="0 0 1380 430" role="img" aria-labelledby="title desc">
  <title id="title">Runtime intervention pipeline</title>
  <desc id="desc">Flow from hidden state through probe score, candidate map, deception-direction gate, optional cap, and activation update, with a separate seeded orthogonal control construction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#263247"/>
    </marker>
  </defs>
  <rect width="1380" height="430" fill="#f7f9fc"/>
  <text x="30" y="42" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Runtime path: candidate transform, directional safety gate, bounded activation edit</text>

  <rect x="30" y="100" width="150" height="100" rx="10" fill="#e7f1ff" stroke="#2367a8" stroke-width="2"/>
  <text x="105" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172033">Hidden state</text>
  <text x="105" y="167" text-anchor="middle" font-family="monospace" font-size="17" fill="#263247">h</text>

  <rect x="230" y="100" width="170" height="100" rx="10" fill="#e9e1ff" stroke="#6448a8" stroke-width="2"/>
  <text x="315" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172033">Probe score</text>
  <text x="315" y="167" text-anchor="middle" font-family="monospace" font-size="15" fill="#263247">z = wᵀh + b</text>

  <rect x="450" y="88" width="200" height="124" rx="10" fill="#fff0c9" stroke="#9a6510" stroke-width="2"/>
  <text x="550" y="123" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172033">Raw candidate</text>
  <text x="550" y="151" text-anchor="middle" font-family="monospace" font-size="14" fill="#263247">candidate = f(z)</text>
  <text x="550" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#526078">add · project · reflect</text>
  <text x="550" y="198" text-anchor="middle" font-family="Arial" font-size="12" fill="#526078">ablate · invert · clamp</text>

  <polygon points="730,83 855,83 895,150 855,217 730,217 690,150" fill="#ffe0df" stroke="#a53a36" stroke-width="2"/>
  <text x="792" y="118" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172033">Directional gate</text>
  <text x="792" y="148" text-anchor="middle" font-family="monospace" font-size="12" fill="#263247">z≥0 → keep z</text>
  <text x="792" y="171" text-anchor="middle" font-family="monospace" font-size="12" fill="#263247">z&lt;0 → max(z,f(z))</text>
  <text x="792" y="197" text-anchor="middle" font-family="Arial" font-size="11" fill="#526078">never move toward honesty</text>

  <rect x="945" y="100" width="160" height="100" rx="10" fill="#fff0c9" stroke="#9a6510" stroke-width="2"/>
  <text x="1025" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172033">Optional cap</text>
  <text x="1025" y="166" text-anchor="middle" font-family="monospace" font-size="12" fill="#263247">|z′−z| ≤ budget</text>

  <rect x="1155" y="88" width="195" height="124" rx="10" fill="#dcf3e7" stroke="#247a52" stroke-width="2"/>
  <text x="1252" y="123" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172033">Activation update</text>
  <text x="1252" y="153" text-anchor="middle" font-family="monospace" font-size="12" fill="#263247">Δh = (z′−z)w/||w||²</text>
  <text x="1252" y="182" text-anchor="middle" font-family="monospace" font-size="15" fill="#263247">h′ = h + Δh</text>

  <path d="M180,150 L230,150" stroke="#263247" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M400,150 L450,150" stroke="#263247" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M650,150 L690,150" stroke="#263247" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M895,150 L945,150" stroke="#263247" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1105,150 L1155,150" stroke="#263247" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="230" y="280" width="875" height="105" rx="12" fill="#edf6ff" stroke="#2367a8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="255" y="313" font-family="Arial" font-size="16" font-weight="700" fill="#172033">Seeded orthogonal control replaces the probe axis, not the score gate</text>
  <text x="255" y="343" font-family="monospace" font-size="13" fill="#263247">g ~ N(0,I)  →  c = g − proj_w(g)  →  c = c · ||w||/||c||  →  reflect h along c</text>
  <text x="255" y="370" font-family="Arial" font-size="12" fill="#526078">Because c⊥w, the truth score wᵀh+b is preserved up to numerical precision. The control remains symmetric.</text>
  <path d="M315,200 L315,280" stroke="#2367a8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
</svg>
